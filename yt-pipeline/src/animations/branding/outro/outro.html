<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- ABN OUTRO — seekable 16:9 composition, 10.40s @ 24fps.
     Contract: window.duration + window.seek(t); every visual state is pure f(t).
     END-SCREEN SAFE: all text lives in the LEFT 55% (x < 1056) and the vertically
     centered band — YouTube end-screen elements own the right side and corners. -->
<style>
  @font-face {
    font-family: 'TikTok Sans 36';
    src: url("../../fonts/TikTokSans36pt-Black.ttf");
    font-weight: 900;
  }
  @font-face {
    font-family: 'TikTok Sans 16';
    src: url("../../fonts/TikTokSans16pt-Bold.ttf");
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #030405; overflow: hidden; }

  .stage { position: relative; width: 1920px; height: 1080px;
    background: radial-gradient(1400px 900px at 30% 55%, #080B0F 0%, #030405 75%); }
  .shaker { position: absolute; inset: 0; }

  /* ambient layers — glow drift, ghost anvil outline, hairlines, grain */
  .glow-red { position: absolute; left: -260px; bottom: -360px; width: 1250px; height: 1050px;
    background: radial-gradient(closest-side, rgba(159,7,17,0.42), rgba(159,7,17,0) 70%); }
  .glow-cyan { position: absolute; right: -300px; top: -380px; width: 1150px; height: 950px;
    background: radial-gradient(closest-side, rgba(22,167,255,0.14), rgba(22,167,255,0) 70%); }
  .ghost-anvil { position: absolute; right: -150px; top: 120px; width: 880px; height: 880px; }
  .ghost-anvil path { fill: none; stroke: rgba(127,210,255,0.07); stroke-width: 0.7; }
  .hairline { position: absolute; left: 140px; width: 1560px; height: 1px;
    background: linear-gradient(90deg, rgba(127,210,255,0.13), rgba(127,210,255,0.02)); }
  .hl-top { top: 150px; } .hl-bot { top: 930px; }
  .grain { position: absolute; inset: -260px; opacity: 0.05;
    background-image: repeating-conic-gradient(rgba(244,247,251,0.6) 0 0.0001%, transparent 0 0.0003%);
    mix-blend-mode: overlay;
    animation: grainShift 10.4s linear 1 both paused; }
  @keyframes grainShift {
    from { transform: translate(0, 0); }
    to   { transform: translate(190px, 130px); }
  }

  /* CTA column — everything textual sits in the left 55%, vertically centered */
  .col { position: absolute; left: 140px; top: 0; width: 880px; height: 1080px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }

  .kicker { display: flex; align-items: center; gap: 16px;
    font-family: 'SF Mono', Menlo, monospace; font-size: 25px; font-weight: 400;
    letter-spacing: 0.06em; color: #8F99A7; margin-bottom: 26px; }
  .kicker .cy { color: #7FD2FF; }
  .kdot { width: 11px; height: 11px; border-radius: 3px; background: #FF2B2F; }

  .headline { font-family: 'TikTok Sans 36'; font-weight: 900; font-size: 126px;
    letter-spacing: -0.025em; line-height: 1.04; color: #F4F7FB; }
  .wword { position: relative; display: inline-block; }
  .headline .w { position: relative; display: inline-block; transform-origin: 50% 60%;
    will-change: transform, opacity; }
  .headline .gw { position: absolute; inset: 0; color: transparent;
    -webkit-text-stroke: 2px rgba(244,247,251,0.22); }
  .headline .red { color: #FF2B2F; }

  .rule { width: 690px; height: 3px; margin: 30px 0 34px; transform-origin: left center;
    background: linear-gradient(90deg, #FF2B2F 0%, #9F0711 55%, transparent 100%); }

  .chip { display: inline-flex; align-items: center; gap: 20px; height: 98px; padding: 0 42px;
    border-radius: 18px; background: #FF2B2F; transform-origin: 18% 50%;
    box-shadow: 0 0 0 rgba(255,43,47,0); will-change: transform, opacity; }
  .chip .thumb { width: 46px; height: 46px; transform-origin: 50% 70%; }
  .chip .thumb path { fill: none; stroke: #F4F7FB; stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round; }
  .chip .label { font-family: 'TikTok Sans 36'; font-weight: 900; font-size: 46px;
    letter-spacing: -0.01em; color: #F4F7FB; white-space: nowrap; }

  .drops { margin-top: 30px; font-family: 'SF Mono', Menlo, monospace; font-size: 26px;
    font-weight: 400; letter-spacing: 0.05em; color: #8F99A7; white-space: nowrap; }
  .drops .cy { color: #7FD2FF; }

  /* final lockup — anvil + wordmark, centered in the left 55% band */
  .lockup { position: absolute; left: 140px; top: 0; width: 880px; height: 1080px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 30px; opacity: 0; will-change: transform, opacity; }
  .lockup .anvil { width: 224px; height: 224px; }
  .lockup .mark { font-family: 'TikTok Sans 36'; font-weight: 900; font-size: 62px;
    letter-spacing: -0.025em; color: #F4F7FB; white-space: nowrap; }
  .lockup .mark .red { color: #FF2B2F; }
  .lockup .lrule { width: 320px; height: 2px;
    background: linear-gradient(90deg, transparent, #9F0711 30%, #FF2B2F 50%, #9F0711 70%, transparent); }
</style>
</head>
<body>
<div class="stage">
  <div class="shaker" id="shaker">
    <div class="glow-red" id="glowRed"></div>
    <div class="glow-cyan" id="glowCyan"></div>

    <svg class="ghost-anvil" id="ghostAnvil" viewBox="0 0 100 100">
      <path d="M14 28 L14 36 L30 36 L30 30 L38 30 L38 28 L86 28 L86 36
        Q78 42 70 44 Q62 46 60 52 L60 64 L66 70 L70 70 L74 76 L26 76 L30 70 L34 70 L40 64 L40 52
        Q38 46 30 44 Q20 42 14 36 Z"/>
      <path d="M50 38 Q56 46 56 52 Q56 59 50 59 Q44 59 44 52 Q44 46 50 38 Z"/>
    </svg>

    <div class="hairline hl-top" id="hlTop"></div>
    <div class="hairline hl-bot" id="hlBot"></div>

    <div class="col" id="cta">
      <div class="kicker" id="kicker"><span class="kdot" id="kdot"></span>
        <span><span class="cy">//</span> END OF BRIEFING</span></div>
      <div class="headline">
        <div><span class="wword"><span class="gw" id="g0">THANKS</span><span class="w" id="w0">THANKS</span></span>
          <span class="wword"><span class="gw" id="g1">FOR</span><span class="w" id="w1">FOR</span></span></div>
        <div><span class="wword"><span class="gw" id="g2">WATCHING.</span><span class="w" id="w2">WATCHING<span class="red">.</span></span></span></div>
      </div>
      <div class="rule" id="rule"></div>
      <div class="chip" id="chip">
        <svg class="thumb" id="thumb" viewBox="0 0 24 24">
          <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/>
          <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
        </svg>
        <span class="label">LIKE &amp; SUBSCRIBE</span>
      </div>
      <div class="drops" id="drops">NEW DROPS DAILY <span class="cy">—</span> AGENTIC BUILDER NEWS</div>
    </div>

    <div class="lockup" id="lockup">
      <svg class="anvil" viewBox="0 0 100 100">
        <path fill="#FF2B2F" d="M14 28 L14 36 L30 36 L30 30 L38 30 L38 28 L86 28 L86 36
          Q78 42 70 44 Q62 46 60 52 L60 64 L66 70 L70 70 L74 76 L26 76 L30 70 L34 70 L40 64 L40 52
          Q38 46 30 44 Q20 42 14 36 Z"/>
        <path fill="#030405" d="M50 38 Q56 46 56 52 Q56 59 50 59 Q44 59 44 52 Q44 46 50 38 Z"/>
        <path fill="#FF2B2F" d="M50 46 Q53 50 53 53 Q53 56 50 56 Q47 56 47 53 Q47 50 50 46 Z"/>
      </svg>
      <div class="mark">AGENTIC BUILDER <span class="red">NEWS</span></div>
      <div class="lrule"></div>
    </div>
  </div>

  <div class="grain" id="grain"></div>
</div>

<script>
  const P = {
    dur: 10.4,
    // music accents in clip-local time (slice starts at source 4.2s)
    beats: [0.44, 0.91, 1.37, 1.84, 2.31, 2.75, 3.2, 3.7],
    slamLen: 0.18,          // word slam ends exactly ON the beat
    ctaOutStart: 8.1,       // music decays from ~8.6 — settle with it
    ctaOutLen: 0.85,
    lockupInStart: 8.55,
    lockupInLen: 0.85,
    dimStart: 8.6,
    dimLen: 1.4
  };

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const seg = (t, s, d) => clamp((t - s) / d);
  const smooth = (v) => { v = clamp(v); return v * v * (3 - 2 * v); };
  const outCubic = (v) => { v = clamp(v); return 1 - Math.pow(1 - v, 3); };
  const backOut = (v) => { v = clamp(v); const c = 1.70158, k = c + 1;
    return 1 + k * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
  const pulse = (t, b, tau) => (t < b ? 0 : Math.exp(-(t - b) / tau));

  window.duration = P.dur;

  window.seek = function seek(t) {
    t = clamp(t, 0, P.dur);
    const B = P.beats;

    // ---- word slams: THANKS / FOR / WATCHING. — each lands ON its accent.
    // Ghost stroke outlines compose frame 0 and fill in as each word slams. ----
    for (let i = 0; i < 3; i++) {
      const p = outCubic(seg(t, B[i] - P.slamLen, P.slamLen));
      const w = $("w" + i);
      w.style.opacity = p;
      w.style.transform = `scale(${1.7 - 0.7 * p})`;
      $("g" + i).style.opacity = 1 - p;
    }

    // ---- rule sweep finishing on beat 1.84 ----
    $("rule").style.transform = `scaleX(${outCubic(seg(t, B[3] - 0.26, 0.26))})`;

    // ---- LIKE & SUBSCRIBE chip pops on beat 2.31 ----
    const cp = seg(t, B[4] - 0.20, 0.30);
    const press = Math.sin(Math.PI * seg(t, B[6] - 0.12, 0.24)); // press flash on 3.2
    const ride = t > B[4] ? 1 + 0.006 * Math.sin((t - B[4]) * 2.1) : 1; // idle breath
    const chip = $("chip");
    chip.style.opacity = clamp(cp * 2.5);
    chip.style.transform = `scale(${(0.4 + 0.6 * backOut(cp)) * (1 - 0.05 * press) * ride})`;
    chip.style.boxShadow = `0 0 ${36 + 30 * press}px rgba(255,43,47,${
      0.28 * clamp(cp * 2) + 0.25 * press})`;
    chip.style.filter = `brightness(${1 + 0.22 * press})`;
    // thumb bump on beat 2.75
    $("thumb").style.transform =
      `rotate(${-14 * Math.sin(Math.PI * seg(t, B[5] - 0.12, 0.24))}deg)`;

    // ---- mono drops line reveals on ~3.7 ----
    const dp = outCubic(seg(t, B[7] - 0.28, 0.34));
    const drops = $("drops");
    drops.style.opacity = dp;
    drops.style.transform = `translateY(${(1 - dp) * 16}px)`;
    drops.style.clipPath = `inset(0 ${(1 - dp) * 100}% 0 0)`;

    // ---- kicker (composed at frame 0, back-dated reveal) ----
    const kp = outCubic(seg(t, -0.4, 0.4));
    $("kicker").style.opacity = kp;
    $("kdot").style.transform = `scale(${1 + 0.25 * Math.sin(t * 4.4)})`;

    // ---- impact: stage shake + red glow flare on the slam beats ----
    let shake = 0, flare = 0;
    [B[0], B[1], B[2], B[4]].forEach((b) => {
      const e = pulse(t, b, 0.09);
      shake += Math.sin((t - b) * 52) * e;
      flare += e;
    });
    $("shaker").style.transform = `translate(${shake * 4}px, ${shake * 2.4}px)`;

    // ---- settle: CTA eases down as the track decays; lockup holds on darkField ----
    const out = smooth(seg(t, P.ctaOutStart, P.ctaOutLen));
    const cta = $("cta");
    cta.style.opacity = 1 - out;
    cta.style.transform = `translateY(${out * 26}px) scale(${1 - 0.02 * out})`;

    const lin = smooth(seg(t, P.lockupInStart, P.lockupInLen));
    const lockup = $("lockup");
    lockup.style.opacity = lin;
    lockup.style.transform = `scale(${1.05 - 0.05 * lin})`;
    lockup.style.filter =
      `drop-shadow(0 0 ${22 + 10 * Math.sin(t * 1.4)}px rgba(255,43,47,${0.22 * lin}))`;

    // ---- ambient drift (glows breathe, ghost anvil floats, hairlines shimmer) ----
    const dim = 1 - 0.4 * smooth(seg(t, P.dimStart, P.dimLen));
    const br = Math.sin(t * 0.85) * 0.5 + 0.5;
    const gr = $("glowRed");
    gr.style.transform =
      `translate(${Math.sin(t * 0.5) * 34}px, ${Math.cos(t * 0.6) * 22}px) scale(${1 + br * 0.07})`;
    gr.style.opacity = clamp((0.85 + 0.5 * flare) * dim, 0, 1.0);
    const gc = $("glowCyan");
    gc.style.transform =
      `translate(${Math.cos(t * 0.42) * 28}px, ${Math.sin(t * 0.55) * 20}px) scale(${1 + (1 - br) * 0.07})`;
    gc.style.opacity = 0.9 * dim;
    $("ghostAnvil").style.transform =
      `translateY(${Math.sin(t * 0.45) * 22}px) rotate(${Math.sin(t * 0.3) * 1.4}deg)`;
    $("ghostAnvil").style.opacity = dim;
    $("hlTop").style.opacity = (0.55 + 0.45 * br) * dim;
    $("hlBot").style.opacity = (0.55 + 0.45 * (1 - br)) * dim;

    // grain: finite CSS keyframe, paused, driven by negative delay
    $("grain").style.animationDelay = `-${t}s`;
  };

  window.seek(0);
</script>
</body>
</html>
