# Railway config for the Rust rewrite service (shadow run → cutover).
#
# Railway auto-detects `railway.toml` (currently the Python one). This file is a
# TEMPLATE — apply these settings to the Rust service:
#   • Shadow run: create a NEW service on this repo/branch and set the values below.
#   • Cutover:    copy this over railway.toml (or point the existing service's
#                 build at Dockerfile.rust) so the SAME domain now serves Rust.
#
# Required env vars on the service (same secrets as the Python app, PLUS ABN_UPSTREAM_URL):
#   ABN_UPSTREAM_URL  → the Python ABN service base URL (reverse-proxied for
#                       /api/agenticnews/* and /api/pipeline/*). During cutover the
#                       ABN factory stays a separate Python service — point here.
#   OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, NOTION_API_KEY, NOTION_CAMPAIGNS_DB,
#   NOTION_PAGES_DB, POSTIZ_API_KEY, R2_ACCESS_KEY/R2_SECRET_KEY/R2_BUCKET,
#   GOOGLE_OAUTH_*, CLOUDFLARE_*, CAMPAIGN_HUB_URL … (identical to Python).
#   RAILWAY_VOLUME_MOUNT_PATH + PORT are set by Railway.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.rust"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"

# SAME volume the Python app uses — the SQLite DB + projects/ live here. `clab
# migrate` (run once, see CUTOVER_RUNBOOK.md) imports the JSON state into SQLite
# on this volume before the flip.
[[mounts]]
mountPath = "/app/projects"
