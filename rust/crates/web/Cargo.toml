[package]
# SPIKE: Yew/WASM frontend — Generate page only, to evaluate vs React+TS.
# Excluded from the native workspace (builds for wasm32 via trunk).
name = "web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Shared wire types — the whole point of the spike: the client imports the
# EXACT structs the server sends. No hand-written TS mirror.
dto = { path = "../dto" }

yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"          # fetch
gloo-timers = { version = "0.3", features = ["futures"] }  # poll interval
gloo-storage = "0.3"      # localStorage (prompt persistence)
gloo-file = { version = "0.3", features = ["futures"] }    # image → base64
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
  "File", "FileList",
] }
