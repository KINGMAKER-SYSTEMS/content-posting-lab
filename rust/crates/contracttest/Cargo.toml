# Contract-parity harness: replays the frozen openapi.json KEEP endpoints
# against a running server (or two, to diff Rust vs Python responses).
[package]
name = "contracttest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "contracttest"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Crate-local deps (contracttest owns its whole tree — free to add within it).
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# none yet — unit tests use inline fixtures only
